# =====================================================================
#  Configuração do Sveltia CMS  —  Frango da Família
#  Painel em: https://SEU-SITE.pages.dev/admin/
# =====================================================================

backend:
  name: github
  repo: sashimi-dev/frango-da-familia
  branch: main
  # URL do OAuth (Cloudflare Worker "sveltia-cms-auth").
  base_url: https://sveltia-cms-auth.green-night-a349.workers.dev

# Onde as imagens enviadas pelo painel são salvas.
media_folder: "public/images"      # caminho no repositório
public_folder: "/images"           # caminho usado no site publicado

# Idioma do painel
locale: pt

collections:
  # -------------------------------------------------------------------
  # CARDÁPIO — um arquivo por prato (src/content/menu/*.md)
  # -------------------------------------------------------------------
  - name: menu
    label: "Cardápio"
    label_singular: "Item do cardápio"
    folder: "src/content/menu"
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{nome}} — R$ {{preco}} ({{categoria}})"
    fields:
      - { name: nome, label: "Nome do prato", widget: string }
      - { name: descricao, label: "Descrição", widget: text, required: false }
      - { name: preco, label: "Preço (R$)", widget: string, hint: "Somente o valor. Ex.: 39,90" }
      - name: categoria
        label: "Categoria"
        widget: select
        options: ["Frangos e Carnes", "Porções", "Pastéis", "Pizza", "Lasanhas", "Bebidas", "Sobremesas"]
        default: "Frangos e Carnes"
      - { name: foto, label: "Foto do prato", widget: image, required: false }
      - { name: ordem, label: "Ordem de exibição", widget: number, default: 99, value_type: int, hint: "Menor aparece primeiro dentro da categoria." }
      - { name: disponivel, label: "Disponível?", widget: boolean, default: true }

  # -------------------------------------------------------------------
  # INFORMAÇÕES DO NEGÓCIO — arquivo único (src/content/site/info.json)
  # -------------------------------------------------------------------
  - name: site
    label: "Informações do negócio"
    files:
      - name: info
        label: "Dados, horários e promoção"
        file: "src/content/site/info.json"
        fields:
          - { name: tagline, label: "Frase de destaque (hero)", widget: string }
          - { name: whatsapp, label: "WhatsApp principal (só números)", widget: string, hint: "Formato 55 + DDD + número. Ex.: 5563992553014" }
          - { name: whatsapp2, label: "WhatsApp 2 (só números)", widget: string, required: false }
          - { name: mensagem_whatsapp, label: "Mensagem inicial do WhatsApp", widget: string }
          - { name: telefone, label: "Telefone (exibição)", widget: string, required: false }
          - { name: endereco, label: "Endereço", widget: text }
          - { name: mapa_url, label: "Link do mapa (Google Maps)", widget: string, required: false }
          - { name: geo_lat, label: "Latitude (mapa)", widget: string, required: false, hint: "No Google Maps, clique com o botão direito no ponto exato -> aparecem 2 números. O 1º é a latitude. Ex.: -10.2846" }
          - { name: geo_lng, label: "Longitude (mapa)", widget: string, required: false, hint: "O 2º número (longitude). Ex.: -48.3765" }
          - name: horarios
            label: "Horários de funcionamento"
            widget: list
            label_singular: "Horário"
            fields:
              - { name: dias, label: "Dias", widget: string, hint: "Ex.: Terça a Sexta" }
              - { name: horario, label: "Horário", widget: string, hint: "Ex.: 11h às 22h" }
          - name: categorias_fim_de_semana
            label: "Categorias só no fim de semana e feriados"
            widget: list
            required: false
            hint: "Essas categorias só podem ser pedidas aos sábados, domingos e feriados (ex.: Frangos e Carnes, Porções). Nos dias de semana aparecem bloqueadas."
            field: { name: categoria, label: "Categoria", widget: string }
          - name: feriados
            label: "Feriados locais (datas extras)"
            widget: list
            required: false
            hint: "Datas no formato AAAA-MM-DD em que vale o cardápio de fim de semana (ex.: 2026-10-05). Os feriados nacionais já são automáticos."
            field: { name: data, label: "Data (AAAA-MM-DD)", widget: string }
          - { name: usar_feriados_nacionais, label: "Aplicar feriados nacionais automaticamente?", widget: boolean, default: true, required: false }
          - { name: aviso_semana, label: "Aviso exibido de segunda a sexta", widget: text, required: false, hint: "Mensagem mostrada nos dias de semana explicando o que está disponível." }
          - { name: hero_imagem, label: "Imagem principal (hero)", widget: image, required: false }
          - { name: logo, label: "Logo", widget: image, required: false }
          - { name: promo_titulo, label: "Destaque — título", widget: string, required: false }
          - { name: promo_texto, label: "Destaque — texto", widget: text, required: false }
          - { name: promo_imagem, label: "Destaque — imagem", widget: image, required: false }
          - { name: historia_titulo, label: "Nossa história — título", widget: string, required: false }
          - { name: historia_texto, label: "Nossa história — texto", widget: text, required: false, hint: "Deixe uma linha em branco para separar parágrafos." }
          - { name: historia_imagem, label: "Nossa história — foto (dono/família)", widget: image, required: false }
          - { name: historia_assinatura, label: "Nossa história — assinatura (nomes dos donos)", widget: string, required: false }
          - { name: instagram_handle, label: "Instagram (@usuário)", widget: string, required: false }
          - { name: instagram_url, label: "Instagram (link do perfil)", widget: string, required: false }
          - { name: instagram_embed, label: "Instagram — código do widget (opcional)", widget: text, required: false, hint: "Só se um dia quiser usar um widget externo. Deixe vazio para usar as fotos em destaque abaixo." }
          - name: instagram_posts
            label: "Instagram — fotos em destaque"
            widget: list
            required: false
            label_singular: "Foto"
            summary: "{{fields.link}}"
            hint: "Suas próprias fotos. Cada uma pode linkar para o post no Instagram."
            fields:
              - { name: imagem, label: "Foto", widget: image }
              - { name: link, label: "Link do post no Instagram (opcional)", widget: string, required: false }
