  <text x="600" y="410" font-family="Georgia, serif" font-size="120" fill="#f2d79a" text-anchor="middle">🍗</text>
  <text x="600" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#f2d79a" opacity="0.65" text-anchor="middle">substitua pela foto do frango na brasa</text>
