      <stop offset="0" stop-color="#2d1a10"/>
      <stop offset="0.55" stop-color="#4d2f1b"/>
      <stop offset="1" stop-color="#2d1a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="22%" r="55%">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.45"/>
